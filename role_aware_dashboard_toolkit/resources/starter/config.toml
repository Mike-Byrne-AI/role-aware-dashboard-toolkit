# Project theme: edit these values to change page, inputs, text and accent.
# The supported starter baseline is Streamlit >=1.65.0.
# This theme uses independent sidebar colors; group fills use keyed containers.
[theme]
base = "light"
backgroundColor = "#F3F6FA"
secondaryBackgroundColor = "#E2E8F0"
textColor = "#172033"
primaryColor = "#0F766E"

[theme.sidebar]
backgroundColor = "#E8EEF4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"

[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
