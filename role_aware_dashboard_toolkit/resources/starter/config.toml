# Project theme: edit these values to change page, inputs, text and accent.
# The supported starter baseline is Python >=3.11 and Streamlit >=1.66.1.
# This theme uses independent sidebar colors; group fills use keyed containers.
[theme]
base = "light"
backgroundColor = "#F6F7F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D342A"
primaryColor = "#2F614B"

[theme.sidebar]
backgroundColor = "#E7EDE1"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D342A"

[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
