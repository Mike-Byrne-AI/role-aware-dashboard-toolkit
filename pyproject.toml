[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "role-aware-dashboard-toolkit"
version = "0.2.0rc1"
description = "Dashboard/admin-control library for governed operator controls, profile workflows, audit history, plugin surfaces, and explicit operational review"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michael Byrne" },
]
keywords = ["dashboard", "admin-controls", "profiles", "audit", "plugins", "observability", "rbac", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/Mike-Byrne-AI/role-aware-dashboard-toolkit"
Issues = "https://github.com/Mike-Byrne-AI/role-aware-dashboard-toolkit/issues"
Documentation = "https://github.com/Mike-Byrne-AI/role-aware-dashboard-toolkit/blob/main/docs/README.md"
Homepage = "https://github.com/Mike-Byrne-AI/role-aware-dashboard-toolkit#readme"

[project.optional-dependencies]
# Keep shared host dependency floors aligned across every applicable extra.
# They exclude reviewed advisory ranges; audit each resolved deployment too.
# A python_version line raises a floor only where older releases ship no
# wheels; check floors with a lowest-direct, wheel-only resolve per Python.
# UI/full/dev require Python 3.11+ through their Streamlit and Pillow floors.
# Core/API/pandas keep Python 3.10 support; do not skip UI dependencies with markers.
workbench = [
    "streamlit>=1.66.1",
    "Pillow>=13.0.0",
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "python-multipart>=0.0.31",
    "h11>=0.16.0",
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
]
auth = [
    "streamlit[auth]>=1.66.1",
    "Pillow>=13.0.0",
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "python-multipart>=0.0.31",
    "h11>=0.16.0",
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
    "Authlib>=1.9.1",
    "cryptography>=50.0.0",
    "joserfc>=1.7.4",
]
pandas = [
    "pandas>=2.2.2",
    "pandas>=2.2.3; python_version >= '3.13'",
    "pandas>=2.3.3; python_version >= '3.14'",
]
api = [
    "fastapi>=0.133.0",
    "pydantic>=2.7.0",
    "pydantic>=2.8.1; python_version >= '3.13'",
    "pydantic>=2.12.0; python_version >= '3.14'",
    "uvicorn>=0.29.0",
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "h11>=0.16.0",
]
full = [
    "streamlit>=1.66.1",
    "streamlit[auth]>=1.66.1",
    "Pillow>=13.0.0",
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "python-multipart>=0.0.31",
    "h11>=0.16.0",
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
    "Authlib>=1.9.1",
    "cryptography>=50.0.0",
    "joserfc>=1.7.4",
    "pandas>=2.2.2",
    "pandas>=2.2.3; python_version >= '3.13'",
    "pandas>=2.3.3; python_version >= '3.14'",
    "fastapi>=0.133.0",
    "pydantic>=2.7.0",
    "pydantic>=2.8.1; python_version >= '3.13'",
    "pydantic>=2.12.0; python_version >= '3.14'",
    "uvicorn>=0.29.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "jsonschema>=4.26.0",
    "black>=24.1.0",
    "ruff>=0.4.0",
    # Runs the root-export typing check (tests/test_public_export_typing.py).
    "mypy>=1.10.0",
    "build>=1.2.0",
    # Twine 7 requires packaging >=26.1, including Core Metadata 2.5 support.
    "twine>=7.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "httpx>=0.27.0",
    "pyotp>=2.9.0,<3",
    "webauthn==3.0.1",
    "streamlit>=1.66.1",
    "streamlit[auth]>=1.66.1",
    "Pillow>=13.0.0",
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "python-multipart>=0.0.31",
    "h11>=0.16.0",
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
    "Authlib>=1.9.1",
    "cryptography>=50.0.0",
    "joserfc>=1.7.4",
    "fastapi>=0.133.0",
    "pydantic>=2.7.0",
    "pydantic>=2.8.1; python_version >= '3.13'",
    "pydantic>=2.12.0; python_version >= '3.14'",
    "uvicorn>=0.29.0",
    "pandas>=2.2.2",
    "pandas>=2.2.3; python_version >= '3.13'",
    "pandas>=2.3.3; python_version >= '3.14'",
]

[project.entry-points."role_aware_dashboard_toolkit.panels"]

[project.entry-points."role_aware_dashboard_toolkit.sidebar"]

[tool.hatch.build.targets.wheel]
packages = ["role_aware_dashboard_toolkit"]
exclude = [
    "/role_aware_dashboard_toolkit/_archive_review",
    "/role_aware_dashboard_toolkit/_archive_review/**",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -p no:cacheprovider"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint]
# Preserve the established error checks when Ruff changes its default rule set.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"role_aware_dashboard_toolkit/__init__.py" = ["F401"]
"role_aware_dashboard_toolkit/*.py" = ["B008", "PERF203", "PERF401", "PERF403", "SIM102"]
"role_aware_dashboard_toolkit/**/*.py" = ["B008", "PERF203", "PERF401", "PERF403", "SIM102"]
"tests/**/*.py" = ["RUF012", "SIM117"]
"tools/**/*.py" = ["PERF401"]

