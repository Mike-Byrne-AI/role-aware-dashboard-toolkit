name: dependency-audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: dependency-audit (${{ matrix.extra }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        extra: [api, full]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build runtime wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/audit-dist"
      - name: Install isolated runtime and audit tool
        env:
          AUDIT_EXTRA: ${{ matrix.extra }}
        run: |
          python -m venv "$RUNNER_TEMP/audit-runtime"
          python -m venv "$RUNNER_TEMP/audit-tool"
          wheel=$(find "$RUNNER_TEMP/audit-dist" -maxdepth 1 -name '*.whl' -type f)
          test -n "$wheel"
          "$RUNNER_TEMP/audit-runtime/bin/python" -m pip install "${wheel}[${AUDIT_EXTRA}]"
          "$RUNNER_TEMP/audit-runtime/bin/python" -m pip check
          "$RUNNER_TEMP/audit-tool/bin/python" -m pip install "pip-audit==2.10.1"
          "$RUNNER_TEMP/audit-tool/bin/python" -m pip check
      - name: Audit resolved runtime dependencies
        run: |
          python tools/audit_dependencies.py \
            --python "$RUNNER_TEMP/audit-runtime/bin/python" \
            --audit-python "$RUNNER_TEMP/audit-tool/bin/python" \
            --report-dir "$RUNNER_TEMP/dependency-audit"
      - name: Retain dependency inventory and audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ matrix.extra }}
          path: ${{ runner.temp }}/dependency-audit
          if-no-files-found: warn
          retention-days: 7

  required:
    name: dependency-checks
    if: ${{ always() }}
    needs: [audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every dependency audit to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["NEEDS_JSON"])
          if set(results) != {"audit"} or results["audit"].get("result") != "success":
              raise SystemExit("Every dependency audit must succeed; findings or incomplete scans block merging.")
          PY
