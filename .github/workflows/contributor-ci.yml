name: contributor-ci

on:
  pull_request:
  push:
    branches: [main, "integrate/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: contributor-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: contributor-tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.11"
          # macOS keeps the system temp directory under the /var symlink.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Test
        run: python -m pytest -q --junitxml="${{ runner.temp }}/contributor-tests.xml"
      - name: Annotate failing test names
        if: ${{ failure() }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          def annotate(level, message):
              escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{level}::{escaped}")

          def failure_location(body):
              # Only a strict final traceback summary may supply public detail.
              # Never emit assertion text, messages, source lines or captured output.
              pattern = r"(.{1,1024}):([1-9][0-9]{0,6}): ([A-Z][A-Za-z0-9_]{0,79})"
              match = next((found for line in reversed(body.splitlines())
                            if (found := re.fullmatch(pattern, line))), None)
              if match is None:
                  return ""
              try:
                  checkout = Path.cwd().resolve()
                  reported = Path(match[1].replace("\\", "/"))
                  relative = reported.relative_to(checkout) if reported.is_absolute() else reported
                  if not relative.parts or relative.parts[0] not in {
                      "tools", "tests", "examples", "role_aware_dashboard_toolkit",
                  }:
                      return ""
                  if (len(relative.as_posix()) > 240 or relative.suffix != ".py"
                          or any(not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,99}", part)
                                 for part in relative.parts)):
                      return ""
                  source = checkout / relative
                  if source.resolve(strict=True) != source or not source.is_file():
                      return ""
                  return f"; failure at {relative.as_posix()}:{match[2]} ({match[3]})"
              except (OSError, ValueError, RuntimeError):
                  return ""

          try:
              directory = os.environ.get("RUNNER_TEMP")
              if not directory:
                  raise ValueError
              with (Path(directory) / "contributor-tests.xml").open("rb") as stream:
                  report = stream.read(16 * 1024 * 1024 + 1)
              if len(report) > 16 * 1024 * 1024:
                  raise ValueError
              root = ET.fromstring(report)
              failures = [case for case in root.iter("testcase")
                          if case.find("failure") is not None or case.find("error") is not None]
              if not failures:
                  annotate("error", "JUnit report lists no failed test cases; inspect the original job failure.")
              for case in failures[:25]:
                  classname = (case.get("classname") or "<unknown class>")[:240]
                  name = (case.get("name") or "<unknown test>")[:240]
                  failure = next(item for item in case if item.tag in {"failure", "error"})
                  location = failure_location(failure.text or "")
                  annotate("error", f"Failed test: {classname}::{name}{location}")
              if len(failures) > 25:
                  annotate("warning", "Additional failing test names omitted; inspect the job logs.")
          except (OSError, ValueError, ET.ParseError):
              annotate("error", "JUnit report unavailable, invalid, or too large; inspect the original job failure.")

  quality:
    name: contributor-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Lint
        run: python -m ruff check role_aware_dashboard_toolkit tools examples tests --no-cache
      - name: Coverage
        run: python -m pytest -q --cov=role_aware_dashboard_toolkit --cov-report=term-missing --cov-fail-under=75
      - name: Build and validate metadata
        run: |
          python -m build
          python -m twine check dist/*

  browser:
    name: contributor-browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[workbench,api]" "playwright==1.63.0" -r examples/business_dashboard/requirements.txt
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Browser smoke
        run: python tools/browser_smoke.py --installed-package --output-dir "$RUNNER_TEMP/browser-smoke"
      - name: Business dashboard browser checks
        run: python tools/business_dashboard_browser.py --output-dir "$RUNNER_TEMP/business-browser"
      - name: Business session and security browser checks
        run: python tools/business_dashboard_browser.py --security-only --output-dir "$RUNNER_TEMP/business-security-browser"
      - name: Business passkey browser checks
        run: python tools/business_dashboard_browser.py --passkeys-only --output-dir "$RUNNER_TEMP/business-passkey-browser"
      - name: Retain browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke
          path: ${{ runner.temp }}/browser-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: Retain business dashboard screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: business-browser
          path: ${{ runner.temp }}/business-browser
          if-no-files-found: warn
          retention-days: 7

      - name: Retain business security diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: business-security-browser
          path: |
            ${{ runner.temp }}/business-security-browser
            ${{ runner.temp }}/business-passkey-browser
          if-no-files-found: warn
          retention-days: 7

  landscaping:
    name: contributor-landscaping-demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install demo dependencies and toolkit
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[api]" -r examples/landscaping/requirements-dev.txt
          python -m pip install "build>=1.2.0"
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Demo API, security, migration and launch checks
        run: python -m pytest -c examples/landscaping/pyproject.toml examples/landscaping/tests --import-mode=importlib -q
      - name: Demo browser checks
        run: python examples/landscaping/scripts/browser_check.py --output-dir "$RUNNER_TEMP/landscaping-browser"
      - name: Demo HTTPS and recovery checks
        run: python examples/landscaping/scripts/operational_check.py --output-dir "$RUNNER_TEMP/landscaping-operations"
      - name: Build and exercise the shipped demo
        run: |
          python -m build --sdist --outdir "$RUNNER_TEMP/landscaping-dist"
          sdists=("$RUNNER_TEMP"/landscaping-dist/*.tar.gz)
          test "${#sdists[@]}" -eq 1 && test -f "${sdists[0]}"
          python tools/landscaping_artifact_smoke.py --sdist "${sdists[0]}" --output-dir "$RUNNER_TEMP/landscaping-artifact"
      - name: Retain sanitized demo release checks
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: landscaping-release-checks
          path: |
            ${{ runner.temp }}/landscaping-operations/summary.json
            ${{ runner.temp }}/landscaping-artifact/summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain demo browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: landscaping-browser
          path: ${{ runner.temp }}/landscaping-browser
          if-no-files-found: warn
          retention-days: 7

  required:
    # Keep this job name stable: main branch protection requires this context.
    name: contributor-checks
    if: ${{ always() }}
    needs: [tests, quality, browser, landscaping]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every contributor job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["NEEDS_JSON"])
          expected = {"tests", "quality", "browser", "landscaping"}
          if set(results) != expected or any(results[job].get("result") != "success" for job in expected):
              raise SystemExit("All contributor jobs must succeed; failed, skipped, or cancelled jobs block merging.")
          PY
