name: ci

on:
  workflow_dispatch:
    inputs:
      release_candidate_reason:
        description: Optional note for why a non-publish release-candidate run is requested.
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: xl422-candidate-validation
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.python-version }})
    # No hosted run is authorized unless the owner opts in this exact commit.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.XL422_CI_APPROVED_SHA == github.sha && (github.ref == 'refs/heads/candidate' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest -q

  coverage-gate:
    # No hosted run is authorized unless the owner opts in this exact commit.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.XL422_CI_APPROVED_SHA == github.sha && (github.ref == 'refs/heads/candidate' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Coverage gate
        run: pytest -q --cov=role_aware_dashboard_toolkit --cov-report=term-missing --cov-fail-under=75

  packaging-release-smoke:
    # No hosted run is authorized unless the owner opts in this exact commit.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.XL422_CI_APPROVED_SHA == github.sha && (github.ref == 'refs/heads/candidate' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Build
        run: python -m build
      - name: Publication hygiene
        run: |
          python tools/pre_release_check.py --json --require-clean > pre_release_report.json || true
          python - <<'PY'
          import json
          import pathlib

          report = json.loads(pathlib.Path("pre_release_report.json").read_text(encoding="utf-8"))
          required_checks = {
              "runtime_version", "changelog_version", "release_audit_doc", "release_checklist_commands",
              "oss_public_coordinates", "distribution_name_ownership", "oss_intake_files",
              "security_intake_contact", "generated_cache_artifacts", "source_tree_clean",
              "changelog_unreleased",
          }
          checks = report.get("checks", [])
          if len(checks) != len(required_checks) or {item.get("id") for item in checks} != required_checks:
              raise SystemExit("pre_release_check must contain every required local check exactly once")
          if report.get("ok") is not True or report.get("status") != "pass" or any(item.get("status") != "pass" for item in checks):
              raise SystemExit("pre_release_check requires all local configuration checks to pass")
          for field, count in (("blocked", "blocked_count"), ("failures", "failure_count"), ("warnings", "warning_count")):
              if report.get(field) != [] or type(report.get(count)) is not int or report[count] != 0:
                  raise SystemExit(f"pre_release_check nonzero or missing {field} summary")
          if report.get("validation_scope") != "local-configuration" or report.get("release_channel") != "github-source":
              raise SystemExit("pre_release_check must declare local GitHub-source configuration scope")
          if not report.get("live_validation_required"):
              raise SystemExit("pre_release_check must retain separate live validation requirements")
          PY
          python -m ruff check role_aware_dashboard_toolkit tools examples tests --no-cache
          python -m twine check dist/*
          python - <<'PY'
          import pathlib
          import stat
          import tarfile
          import zipfile

          from role_aware_dashboard_toolkit import release_audit
          from role_aware_dashboard_toolkit.release_audit import audit_release_artifact_members

          artifacts = sorted(pathlib.Path("dist").iterdir())
          assert len(artifacts) == 2, "expected exactly one wheel and one sdist"
          assert sum(path.suffix == ".whl" for path in artifacts) == 1
          assert sum(path.name.endswith(".tar.gz") for path in artifacts) == 1
          for artifact in artifacts:
              assert artifact.is_file() and not artifact.is_symlink(), artifact.name
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      entries = archive.infolist()
                      assert all(not item.is_dir() and stat.S_IFMT(item.external_attr >> 16) in {0, stat.S_IFREG} for item in entries), "special wheel member"
                      members = [item.filename for item in entries]
                  expected = set(release_audit._PUBLIC_PACKAGE_MEMBERS) | {
                      release_audit._WHEEL_METADATA_ROOT + "/" + name
                      for name in release_audit._WHEEL_METADATA_MEMBERS
                  }
              else:
                  with tarfile.open(artifact, "r:gz") as archive:
                      entries = archive.getmembers()
                      assert all(item.isfile() for item in entries), "special sdist member"
                      members = [item.name for item in entries]
                  expected = {
                      release_audit._SDIST_ROOT + "/" + name
                      for name in set(release_audit._PUBLIC_PACKAGE_MEMBERS) | set(release_audit._PUBLIC_SDIST_MEMBERS)
                  }
              assert len(members) == len(set(members)), "duplicate artifact member"
              assert set(members) == expected, {
                  "artifact": artifact.name,
                  "missing": sorted(expected - set(members)),
                  "unexpected": sorted(set(members) - expected),
              }
              audit = audit_release_artifact_members(members)
              assert audit["ok"], audit
          PY
      - name: Wheel install smoke
        run: |
          python -m venv "$RUNNER_TEMP/.wheel-smoke"
          "$RUNNER_TEMP/.wheel-smoke/bin/python" -m pip install --no-index --find-links dist role-aware-dashboard-toolkit
          "$RUNNER_TEMP/.wheel-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/.wheel-smoke/bin/python" -I - <<'PY'
          import importlib.util
          import os
          import pathlib
          import sys
          import tempfile

          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          def _resolved(value: str) -> pathlib.Path:
              return pathlib.Path(value or ".").resolve()
          def _is_repo_path(path: pathlib.Path) -> bool:
              return path == repo or repo in path.parents

          environment = pathlib.Path(sys.prefix).resolve()
          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
          assert environment.is_relative_to(runner_temp)
          assert not _is_repo_path(environment)
          assert all(not _is_repo_path(_resolved(value)) for value in sys.path)

          previous_directory = pathlib.Path.cwd()
          with tempfile.TemporaryDirectory(dir=runner_temp) as tmpdir:
              try:
                  os.chdir(tmpdir)
                  import role_aware_dashboard_toolkit as radt
                  from role_aware_dashboard_toolkit import dashboard as dashboard_module
                  from role_aware_dashboard_toolkit.diagnostics import build_diagnostic, diagnostic_text

                  assert pathlib.Path(radt.__file__).resolve().is_relative_to(environment)
                  assert importlib.util.find_spec("streamlit") is None
                  assert "streamlit" not in sys.modules
                  assert radt.DashboardConfig is dashboard_module.DashboardConfig
                  assert radt.render is dashboard_module.render
                  config = radt.DashboardConfig(icon="Core", layout="columns", run_store=None)
                  assert config.icon == "Core"
                  assert config.layout == "columns"
                  run = radt.build_run({"refresh_seconds": 10}, actor="ci")
                  packet = radt.build_run_packet(run)
                  assert packet["packet_type"] == "run"
                  assert packet["payload"]["run_id"] == run["run_id"]
                  try:
                      radt.render(config)
                  except ModuleNotFoundError as exc:
                      assert exc.name == "streamlit"
                      assert str(exc) == (
                          "Streamlit is required for Role-Aware Dashboard Toolkit dashboard rendering. "
                          'From your reviewed toolkit source checkout, run: python -m pip install ".[workbench]". '
                          "From another directory, use the absolute source path or local wheel filename "
                          "with [workbench] appended. No package-index release is assumed."
                          " " + diagnostic_text("RADT-STREAMLIT")
                      )
                      assert exc.diagnostic == build_diagnostic("RADT-STREAMLIT")
                  else:
                      raise AssertionError("core wheel render should require the workbench extra")
                  print(radt.__version__)
              finally:
                  os.chdir(previous_directory)
          PY
      - name: Wheel optional-extra smokes
        run: |
          wheel="$(python - <<'PY'
          import pathlib

          wheels = sorted(pathlib.Path("dist").glob("role_aware_dashboard_toolkit-*.whl"))
          assert len(wheels) == 1, wheels
          print(wheels[0])
          PY
          )"
          python -m venv "$RUNNER_TEMP/.wheel-workbench-smoke"
          "$RUNNER_TEMP/.wheel-workbench-smoke/bin/python" -m pip install "${wheel}[workbench]"
          "$RUNNER_TEMP/.wheel-workbench-smoke/bin/python" -m pip check
          (
            cd "$(mktemp -d "$RUNNER_TEMP/radt-smoke.XXXXXX")"
            "$RUNNER_TEMP/.wheel-workbench-smoke/bin/python" -I - <<'PY'
          import os
          import pathlib
          import sys

          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          environment = pathlib.Path(sys.prefix).resolve()
          assert environment.is_relative_to(pathlib.Path(os.environ["RUNNER_TEMP"]).resolve())
          assert not environment.is_relative_to(repo)
          assert all(not pathlib.Path(value or ".").resolve().is_relative_to(repo) for value in sys.path)

          import role_aware_dashboard_toolkit
          import streamlit

          assert pathlib.Path(role_aware_dashboard_toolkit.__file__).resolve().is_relative_to(environment)
          assert streamlit.__name__ == "streamlit"
          PY
          )
          python -m venv "$RUNNER_TEMP/.wheel-auth-smoke"
          "$RUNNER_TEMP/.wheel-auth-smoke/bin/python" -m pip install "${wheel}[auth]"
          "$RUNNER_TEMP/.wheel-auth-smoke/bin/python" -m pip check
          (
            cd "$(mktemp -d "$RUNNER_TEMP/radt-smoke.XXXXXX")"
            "$RUNNER_TEMP/.wheel-auth-smoke/bin/python" -I - <<'PY'
          import os
          import pathlib
          import sys

          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          environment = pathlib.Path(sys.prefix).resolve()
          assert environment.is_relative_to(pathlib.Path(os.environ["RUNNER_TEMP"]).resolve())
          assert not environment.is_relative_to(repo)
          assert all(not pathlib.Path(value or ".").resolve().is_relative_to(repo) for value in sys.path)

          import role_aware_dashboard_toolkit
          import authlib
          import streamlit
          from role_aware_dashboard_toolkit.access import AccessPolicy, InMemoryAccessStore, SQLiteAccessStore
          from role_aware_dashboard_toolkit.access_cli import initialize_access
          from role_aware_dashboard_toolkit.guidance import read_guide, read_starter
          from role_aware_dashboard_toolkit.streamlit_auth import StreamlitIdentityResolver

          assert pathlib.Path(role_aware_dashboard_toolkit.__file__).resolve().is_relative_to(environment)
          assert authlib.__name__ == "authlib"
          assert all(callable(api) for api in (streamlit.login, streamlit.logout, AccessPolicy, InMemoryAccessStore, SQLiteAccessStore, initialize_access, StreamlitIdentityResolver))
          starter = read_starter(authenticated=True)
          assert set(starter) == {"app.py", ".streamlit/config.toml", "AGENTS.md", "README.md", ".gitignore"}
          assert 'auth_mode="authenticated"' in starter["app.py"]
          compile(starter["app.py"], "authenticated-starter/app.py", "exec")
          assert "access_cli grant" in read_guide("authentication")["content"]
          PY
          )
          python -m venv "$RUNNER_TEMP/.wheel-api-smoke"
          "$RUNNER_TEMP/.wheel-api-smoke/bin/python" -m pip install "${wheel}[api]"
          "$RUNNER_TEMP/.wheel-api-smoke/bin/python" -m pip check
          (
            cd "$(mktemp -d "$RUNNER_TEMP/radt-smoke.XXXXXX")"
            "$RUNNER_TEMP/.wheel-api-smoke/bin/python" -I - <<'PY'
          import importlib.util
          import os
          import pathlib
          import sys

          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          environment = pathlib.Path(sys.prefix).resolve()
          assert environment.is_relative_to(pathlib.Path(os.environ["RUNNER_TEMP"]).resolve())
          assert not environment.is_relative_to(repo)
          assert all(not pathlib.Path(value or ".").resolve().is_relative_to(repo) for value in sys.path)

          import role_aware_dashboard_toolkit
          import fastapi
          import pydantic
          import uvicorn
          from role_aware_dashboard_toolkit.api import FASTAPI_AVAILABLE, create_app

          assert pathlib.Path(role_aware_dashboard_toolkit.__file__).resolve().is_relative_to(environment)
          assert FASTAPI_AVAILABLE is True
          assert importlib.util.find_spec("streamlit") is None
          app = create_app(role_aware_dashboard_toolkit.ControlRegistry())
          assert {"/health", "/controls"} <= {route.path for route in app.routes}
          assert fastapi.__name__ == "fastapi"
          assert pydantic.__name__ == "pydantic"
          assert uvicorn.__name__ == "uvicorn"
          PY
          )
          python -m venv "$RUNNER_TEMP/.wheel-pandas-smoke"
          "$RUNNER_TEMP/.wheel-pandas-smoke/bin/python" -m pip install "${wheel}[pandas]"
          "$RUNNER_TEMP/.wheel-pandas-smoke/bin/python" -m pip check
          (
            cd "$(mktemp -d "$RUNNER_TEMP/radt-smoke.XXXXXX")"
            "$RUNNER_TEMP/.wheel-pandas-smoke/bin/python" -I - <<'PY'
          import os
          import pathlib
          import sys

          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          environment = pathlib.Path(sys.prefix).resolve()
          assert environment.is_relative_to(pathlib.Path(os.environ["RUNNER_TEMP"]).resolve())
          assert not environment.is_relative_to(repo)
          assert all(not pathlib.Path(value or ".").resolve().is_relative_to(repo) for value in sys.path)

          import role_aware_dashboard_toolkit
          import pandas

          assert pathlib.Path(role_aware_dashboard_toolkit.__file__).resolve().is_relative_to(environment)
          assert pandas.__name__ == "pandas"
          PY
          )
          python -m venv "$RUNNER_TEMP/.wheel-full-smoke"
          "$RUNNER_TEMP/.wheel-full-smoke/bin/python" -m pip install "${wheel}[full]"
          "$RUNNER_TEMP/.wheel-full-smoke/bin/python" -m pip check
          (
            cd "$(mktemp -d "$RUNNER_TEMP/radt-smoke.XXXXXX")"
            "$RUNNER_TEMP/.wheel-full-smoke/bin/python" -I - <<'PY'
          import os
          import pathlib
          import sys

          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          environment = pathlib.Path(sys.prefix).resolve()
          assert environment.is_relative_to(pathlib.Path(os.environ["RUNNER_TEMP"]).resolve())
          assert not environment.is_relative_to(repo)
          assert all(not pathlib.Path(value or ".").resolve().is_relative_to(repo) for value in sys.path)

          import role_aware_dashboard_toolkit
          import authlib
          import fastapi
          import pandas
          import pydantic
          import streamlit
          import uvicorn
          from role_aware_dashboard_toolkit.access import AccessPolicy, InMemoryAccessStore, SQLiteAccessStore
          from role_aware_dashboard_toolkit.access_cli import initialize_access
          from role_aware_dashboard_toolkit.guidance import read_guide, read_starter
          from role_aware_dashboard_toolkit.streamlit_auth import StreamlitIdentityResolver

          assert pathlib.Path(role_aware_dashboard_toolkit.__file__).resolve().is_relative_to(environment)
          assert all(
              module.__name__
              for module in (authlib, fastapi, pandas, pydantic, streamlit, uvicorn)
          )
          assert all(callable(api) for api in (streamlit.login, streamlit.logout, AccessPolicy, InMemoryAccessStore, SQLiteAccessStore, initialize_access, StreamlitIdentityResolver))
          starter = read_starter(authenticated=True)
          assert set(starter) == {"app.py", ".streamlit/config.toml", "AGENTS.md", "README.md", ".gitignore"}
          assert 'auth_mode="authenticated"' in starter["app.py"]
          compile(starter["app.py"], "authenticated-starter/app.py", "exec")
          assert "access_cli grant" in read_guide("authentication")["content"]
          PY
          )
      - name: Sdist install smoke
        run: |
          python -m venv "$RUNNER_TEMP/.sdist-smoke"
          sdist="$(python - <<'PY'
          import pathlib

          sdists = sorted(pathlib.Path("dist").glob("role_aware_dashboard_toolkit-*.tar.gz"))
          assert len(sdists) == 1, sdists
          print(sdists[0])
          PY
          )"
          "$RUNNER_TEMP/.sdist-smoke/bin/python" -m pip install --use-pep517 "$sdist"
          "$RUNNER_TEMP/.sdist-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/.sdist-smoke/bin/python" -I - <<'PY'
          import importlib.util
          import os
          import pathlib
          import sys
          import tempfile

          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          def _resolved(value: str) -> pathlib.Path:
              return pathlib.Path(value or ".").resolve()
          def _is_repo_path(path: pathlib.Path) -> bool:
              return path == repo or repo in path.parents

          environment = pathlib.Path(sys.prefix).resolve()
          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
          assert environment.is_relative_to(runner_temp)
          assert not _is_repo_path(environment)
          assert all(not _is_repo_path(_resolved(value)) for value in sys.path)

          previous_directory = pathlib.Path.cwd()
          with tempfile.TemporaryDirectory(dir=runner_temp) as tmpdir:
              try:
                  os.chdir(tmpdir)
                  import role_aware_dashboard_toolkit as radt
                  from role_aware_dashboard_toolkit import dashboard as dashboard_module

                  assert pathlib.Path(radt.__file__).resolve().is_relative_to(environment)
                  assert importlib.util.find_spec("streamlit") is None
                  assert "streamlit" not in sys.modules
                  assert radt.DashboardConfig is dashboard_module.DashboardConfig
                  assert radt.render is dashboard_module.render
                  config = radt.DashboardConfig(icon="Core", layout="columns", run_store=None)
                  assert config.icon == "Core"
                  assert config.layout == "columns"
                  run = radt.build_run({"refresh_seconds": 10}, actor="ci")
                  packet = radt.build_run_packet(run)
                  assert packet["packet_type"] == "run"
                  assert packet["payload"]["run_id"] == run["run_id"]
                  try:
                      radt.render(config)
                  except ModuleNotFoundError as exc:
                      assert exc.name == "streamlit"
                      assert 'python -m pip install ".[workbench]"' in str(exc)
                      assert "absolute source path or local wheel filename" in str(exc)
                      assert "No package-index release is assumed" in str(exc)
                  else:
                      raise AssertionError("core sdist render should require the workbench extra")
                  print(radt.__version__)
              finally:
                  os.chdir(previous_directory)
          PY
      - name: Upload validated distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: role_aware_dashboard_toolkit-validated-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 1
  release-candidate:
    # No hosted run is authorized unless the owner opts in this exact commit.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.XL422_CI_APPROVED_SHA == github.sha && (github.ref == 'refs/heads/candidate' || github.ref == 'refs/heads/main') }}
    needs: [test, coverage-gate, packaging-release-smoke, windows-release-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Download validated distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: role_aware_dashboard_toolkit-validated-dist
          path: dist
          digest-mismatch: error
      - name: Download Windows artifact evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: role_aware_dashboard_toolkit-windows-artifact-evidence
          path: ${{ runner.temp }}/windows-evidence
          digest-mismatch: error
      - name: Release-candidate publication hygiene
        run: |
          python tools/pre_release_check.py --json --require-clean > pre_release_report.json || true
          python - <<'PY'
          import json
          import pathlib

          report = json.loads(pathlib.Path("pre_release_report.json").read_text(encoding="utf-8"))
          required_checks = {
              "runtime_version", "changelog_version", "release_audit_doc", "release_checklist_commands",
              "oss_public_coordinates", "distribution_name_ownership", "oss_intake_files",
              "security_intake_contact", "generated_cache_artifacts", "source_tree_clean",
              "changelog_unreleased",
          }
          checks = report.get("checks", [])
          if len(checks) != len(required_checks) or {item.get("id") for item in checks} != required_checks:
              raise SystemExit("pre_release_check must contain every required local check exactly once")
          if report.get("ok") is not True or report.get("status") != "pass" or any(item.get("status") != "pass" for item in checks):
              raise SystemExit("pre_release_check requires all local configuration checks to pass")
          for field, count in (("blocked", "blocked_count"), ("failures", "failure_count"), ("warnings", "warning_count")):
              if report.get(field) != [] or type(report.get(count)) is not int or report[count] != 0:
                  raise SystemExit(f"pre_release_check nonzero or missing {field} summary")
          if report.get("validation_scope") != "local-configuration" or report.get("release_channel") != "github-source":
              raise SystemExit("pre_release_check must declare local GitHub-source configuration scope")
          if not report.get("live_validation_required"):
              raise SystemExit("pre_release_check must retain separate live validation requirements")
          PY
      - name: Twine check
        run: python -m twine check dist/*
      - name: Artifact hygiene audit
        run: |
          python - <<'PY'
          import pathlib
          import stat
          import tarfile
          import zipfile

          from role_aware_dashboard_toolkit import release_audit
          from role_aware_dashboard_toolkit.release_audit import audit_release_artifact_members

          artifacts = sorted(pathlib.Path("dist").iterdir())
          assert len(artifacts) == 2, "expected exactly one wheel and one sdist"
          assert sum(path.suffix == ".whl" for path in artifacts) == 1
          assert sum(path.name.endswith(".tar.gz") for path in artifacts) == 1
          for artifact in artifacts:
              assert artifact.is_file() and not artifact.is_symlink(), artifact.name
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      entries = archive.infolist()
                      assert all(not item.is_dir() and stat.S_IFMT(item.external_attr >> 16) in {0, stat.S_IFREG} for item in entries), "special wheel member"
                      members = [item.filename for item in entries]
                  expected = set(release_audit._PUBLIC_PACKAGE_MEMBERS) | {
                      release_audit._WHEEL_METADATA_ROOT + "/" + name
                      for name in release_audit._WHEEL_METADATA_MEMBERS
                  }
              else:
                  with tarfile.open(artifact, "r:gz") as archive:
                      entries = archive.getmembers()
                      assert all(item.isfile() for item in entries), "special sdist member"
                      members = [item.name for item in entries]
                  expected = {
                      release_audit._SDIST_ROOT + "/" + name
                      for name in set(release_audit._PUBLIC_PACKAGE_MEMBERS) | set(release_audit._PUBLIC_SDIST_MEMBERS)
                  }
              assert len(members) == len(set(members)), "duplicate artifact member"
              assert set(members) == expected, {
                  "artifact": artifact.name,
                  "missing": sorted(expected - set(members)),
                  "unexpected": sorted(set(members) - expected),
              }
              audit = audit_release_artifact_members(members)
              assert audit["ok"], audit
          PY
      - name: Build release-candidate evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          import role_aware_dashboard_toolkit as radt
          from role_aware_dashboard_toolkit.release_audit import build_release_manifest

          ref = os.environ.get("GITHUB_REF", "")
          if ref not in {"refs/heads/candidate", "refs/heads/main"}:
              raise SystemExit("release-candidate evidence requires the candidate or main branch")
          try:
              run_id = int(os.environ["GITHUB_RUN_ID"])
              run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          except (KeyError, ValueError) as exc:
              raise SystemExit("positive GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT are required") from exc
          if run_id <= 0 or run_attempt <= 0:
              raise SystemExit("positive GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT are required")
          source_sha = os.environ.get("GITHUB_SHA", "").strip()
          if not source_sha:
              raise SystemExit("GITHUB_SHA is required for release-candidate evidence")
          workspace = pathlib.Path(os.environ.get("GITHUB_WORKSPACE") or ".").resolve()
          checked_out_sha = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              cwd=workspace,
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if source_sha != checked_out_sha:
              raise SystemExit(f"GITHUB_SHA {source_sha} does not match checked-out commit {checked_out_sha}")
          artifacts = sorted(path for path in pathlib.Path("dist").iterdir() if path.is_file())
          if len([path for path in artifacts if path.suffix == ".whl"]) != 1:
              raise SystemExit("release candidate requires exactly one wheel")
          if len([path for path in artifacts if path.name.endswith(".tar.gz")]) != 1:
              raise SystemExit("release candidate requires exactly one sdist")
          if len(artifacts) != 2:
              raise SystemExit("release candidate requires exactly two distribution artifacts")
          artifact_sha256 = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in artifacts}
          windows_evidence = json.loads(
              (pathlib.Path(os.environ["RUNNER_TEMP"]) / "windows-evidence" / "windows_artifact_evidence.json").read_text(encoding="utf-8")
          )
          if (
              windows_evidence.get("source_sha") != source_sha
              or windows_evidence.get("run_id") != run_id
              or windows_evidence.get("run_attempt") != run_attempt
              or windows_evidence.get("artifact_sha256") != artifact_sha256
          ):
              raise SystemExit("Windows smoke evidence must match this run, source, and exact artifact bytes")
          pre_release = json.loads(pathlib.Path("pre_release_report.json").read_text(encoding="utf-8"))
          evidence = {
              "version": radt.__version__,
              "source_sha": source_sha,
              "run_id": run_id,
              "run_attempt": run_attempt,
              "head_branch": ref.removeprefix("refs/heads/"),
              "workflow_path": ".github/workflows/ci.yml",
              "artifact_sha256": artifact_sha256,
              "windows_artifact_sha256": windows_evidence["artifact_sha256"],
              "pre_release_status": pre_release.get("status"),
              "validation_scope": pre_release["validation_scope"],
              "release_channel": pre_release["release_channel"],
              "live_validation_required": pre_release["live_validation_required"],
              "blocked": pre_release.get("blocked", []),
              "failure_count": int(pre_release.get("failure_count", len(pre_release.get("failures", [])))),
              "release_manifest": build_release_manifest(),
          }
          pathlib.Path("release_candidate_evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload release-candidate dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: role_aware_dashboard_toolkit-release-candidate-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 1
      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: role_aware_dashboard_toolkit-release-candidate-evidence
          path: |
            pre_release_report.json
            release_candidate_evidence.json
          if-no-files-found: error
          retention-days: 1
  windows-release-smoke:
    # No hosted run is authorized unless the owner opts in this exact commit.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.XL422_CI_APPROVED_SHA == github.sha && (github.ref == 'refs/heads/candidate' || github.ref == 'refs/heads/main') }}
    needs: [packaging-release-smoke]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Windows focused tests
        shell: powershell
        run: python -m pytest tests/test_path_redaction.py tests/test_permission_boundaries.py tests/test_review_identifier_regressions.py tests/test_store_identifier_contract.py -q -p no:cacheprovider -o addopts=
      - name: Download validated distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: role_aware_dashboard_toolkit-validated-dist
          path: dist
          digest-mismatch: error
      - name: Record Windows artifact hashes
        shell: python
        run: |
          import hashlib
          import json
          import os
          import pathlib

          artifacts = sorted(pathlib.Path("dist").iterdir())
          if (
              len(artifacts) != 2
              or sum(path.suffix == ".whl" for path in artifacts) != 1
              or sum(path.name.endswith(".tar.gz") for path in artifacts) != 1
              or any(not path.is_file() or path.is_symlink() for path in artifacts)
          ):
              raise SystemExit("Windows smoke requires exactly one downloaded wheel and one sdist")
          evidence = {
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "artifact_sha256": {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in artifacts
              },
          }
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "windows_artifact_evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8",
          )
      - name: Wheel install smoke (Windows)
        shell: powershell
        run: |
          $venv = Join-Path $env:RUNNER_TEMP ".wheel-smoke-win"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $venvPython = Join-Path $venv "Scripts\python.exe"
          & $venvPython -m pip install --no-index --find-links dist role-aware-dashboard-toolkit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $venvPython -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smoke = @"
          import importlib.util
          import os
          import pathlib
          import sys
          import tempfile

          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
          environment = pathlib.Path(sys.prefix).resolve()
          assert environment.is_relative_to(runner_temp)
          assert not environment.is_relative_to(repo)
          assert all(not pathlib.Path(value or ".").resolve().is_relative_to(repo) for value in sys.path)
          previous_directory = pathlib.Path.cwd()
          with tempfile.TemporaryDirectory(dir=runner_temp) as tmpdir:
              try:
                  os.chdir(tmpdir)
                  import role_aware_dashboard_toolkit as radt
                  assert pathlib.Path(radt.__file__).resolve().is_relative_to(environment)
                  assert importlib.util.find_spec("streamlit") is None
                  config = radt.DashboardConfig(icon="Core", layout="columns", run_store=None)
                  assert config.icon == "Core"
                  assert config.layout == "columns"
                  run = radt.build_run({"refresh_seconds": 10}, actor="ci")
                  packet = radt.build_run_packet(run)
                  assert packet["packet_type"] == "run"
                  assert packet["payload"]["run_id"] == run["run_id"]
                  print(radt.__version__)
              finally:
                  os.chdir(previous_directory)
          "@
          $smoke | & $venvPython -I -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Auth wheel install smoke (Windows)
        shell: powershell
        run: |
          $authVenv = Join-Path $env:RUNNER_TEMP ".wheel-auth-smoke-win"
          python -m venv $authVenv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $authPython = Join-Path $authVenv "Scripts\python.exe"
          $wheels = @(Get-ChildItem -LiteralPath dist -Filter "role_aware_dashboard_toolkit-*.whl" -File)
          if ($wheels.Count -ne 1) { throw "Expected exactly one downloaded wheel." }
          & $authPython -m pip install "$($wheels[0].FullName)[auth]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $authPython -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $authSmoke = @'
          import os
          import pathlib
          import sys
          import tempfile

          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
          environment = pathlib.Path(sys.prefix).resolve()
          assert environment.is_relative_to(runner_temp)
          assert not environment.is_relative_to(repo)
          assert all(not pathlib.Path(value or ".").resolve().is_relative_to(repo) for value in sys.path)
          previous_directory = pathlib.Path.cwd()
          with tempfile.TemporaryDirectory(dir=runner_temp) as tmpdir:
              try:
                  os.chdir(tmpdir)
                  import role_aware_dashboard_toolkit
                  import authlib
                  import streamlit
                  from role_aware_dashboard_toolkit.access import AccessPolicy, InMemoryAccessStore, SQLiteAccessStore
                  from role_aware_dashboard_toolkit.access_cli import initialize_access
                  from role_aware_dashboard_toolkit.guidance import read_guide, read_starter
                  from role_aware_dashboard_toolkit.streamlit_auth import StreamlitIdentityResolver

                  assert pathlib.Path(role_aware_dashboard_toolkit.__file__).resolve().is_relative_to(environment)
                  assert authlib.__name__ == "authlib"
                  assert all(callable(api) for api in (streamlit.login, streamlit.logout, AccessPolicy, InMemoryAccessStore, SQLiteAccessStore, initialize_access, StreamlitIdentityResolver))
                  starter = read_starter(authenticated=True)
                  assert set(starter) == {"app.py", ".streamlit/config.toml", "AGENTS.md", "README.md", ".gitignore"}
                  assert 'auth_mode="authenticated"' in starter["app.py"]
                  compile(starter["app.py"], "authenticated-starter/app.py", "exec")
                  assert "access_cli grant" in read_guide("authentication")["content"]
              finally:
                  os.chdir(previous_directory)
          '@
          $authSmoke | & $authPython -I -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows artifacts stayed unchanged
        shell: python
        run: |
          import hashlib
          import json
          import os
          import pathlib

          recorded = json.loads(
              (pathlib.Path(os.environ["RUNNER_TEMP"]) / "windows_artifact_evidence.json").read_text(encoding="utf-8")
          )
          artifacts = sorted(pathlib.Path("dist").iterdir())
          if any(not path.is_file() or path.is_symlink() for path in artifacts):
              raise SystemExit("Windows distribution artifacts must remain regular files")
          current = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in artifacts}
          if current != recorded["artifact_sha256"]:
              raise SystemExit("Windows distribution artifacts changed during install smokes")
      - name: Upload Windows artifact evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: role_aware_dashboard_toolkit-windows-artifact-evidence
          path: ${{ runner.temp }}/windows_artifact_evidence.json
          if-no-files-found: error
          retention-days: 1
