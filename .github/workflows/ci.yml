name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_candidate_reason:
        description: Optional note for why a non-publish release-candidate run is requested.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    # Disabled until the owner explicitly authorizes hosted CI spending.
    if: ${{ false }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest -q

  coverage-gate:
    # Disabled until the owner explicitly authorizes hosted CI spending.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Coverage gate
        run: pytest -q --cov=role_aware_dashboard_toolkit --cov-report=term-missing --cov-fail-under=75

  packaging-release-smoke:
    # Disabled until the owner explicitly authorizes hosted CI spending.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Build
        run: python -m build
      - name: Publication hygiene
        run: |
          python tools/pre_release_check.py --json --require-clean > pre_release_report.json || true
          python - <<'PY'
          import json
          import os
          import pathlib

          report = json.loads(pathlib.Path("pre_release_report.json").read_text(encoding="utf-8"))
          ref = os.environ.get("GITHUB_REF", "")
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          is_release_context = ref.startswith("refs/tags/") or (ref == "refs/heads/main" and event_name != "workflow_dispatch")
          # Pre-OSS release state remains intentionally blocked only on these gates.
          allowed_blocked = {"distribution_name_ownership", "oss_public_coordinates", "security_intake_contact"}
          blocked = sorted(report.get("blocked", []))
          unexpected_blocked = sorted(item for item in blocked if item not in allowed_blocked)
          failures = list(report.get("failures", []))
          if failures:
              raise SystemExit(f"pre_release_check failures present: {failures}")
          if is_release_context and blocked:
              raise SystemExit(f"pre_release_check blocked checks are not allowed for release contexts: {blocked}")
          if unexpected_blocked:
              raise SystemExit(f"pre_release_check unexpected blocked checks: {unexpected_blocked}")
          PY
          python -m ruff check role_aware_dashboard_toolkit tools examples tests --no-cache
          python -m twine check dist/*
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          from role_aware_dashboard_toolkit.release_audit import audit_release_artifact_members

          members = []
          for artifact in pathlib.Path("dist").iterdir():
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      members.extend(archive.namelist())
              elif artifact.name.endswith(".tar.gz"):
                  with tarfile.open(artifact, "r:gz") as archive:
                      members.extend(archive.getnames())

          assert members
          audit = audit_release_artifact_members(members)
          assert audit["ok"], audit
          PY
      - name: Wheel install smoke
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --no-index --find-links dist role_aware_dashboard_toolkit
          .wheel-smoke/bin/python - <<'PY'
          import importlib.util
          import os
          import pathlib
          import sys
          import tempfile

          repo = pathlib.Path.cwd().resolve()
          def _resolved(value: str) -> pathlib.Path:
              return pathlib.Path(value or ".").resolve()
          def _is_repo_path(path: pathlib.Path) -> bool:
              return path == repo or repo in path.parents

          sys.path[:] = [
              value
              for value in sys.path
              if not _is_repo_path(_resolved(value))
          ]
          assert all(not _is_repo_path(_resolved(value)) for value in sys.path)

          with tempfile.TemporaryDirectory() as tmpdir:
              os.chdir(tmpdir)
              import role_aware_dashboard_toolkit as radt
              from role_aware_dashboard_toolkit import dashboard as dashboard_module

              assert ".wheel-smoke" in str(pathlib.Path(radt.__file__).resolve())
              assert importlib.util.find_spec("streamlit") is None
              assert "streamlit" not in sys.modules
              assert radt.DashboardConfig is dashboard_module.DashboardConfig
              assert radt.render is dashboard_module.render
              config = radt.DashboardConfig(icon="Core", layout="columns", run_store=None)
              assert config.icon == "Core"
              assert config.layout == "columns"
              run = radt.build_run({"refresh_seconds": 10}, actor="ci")
              packet = radt.build_run_packet(run)
              assert packet["packet_type"] == "run"
              assert packet["payload"]["run_id"] == run["run_id"]
              try:
                  radt.render(config)
              except ModuleNotFoundError as exc:
                  assert exc.name == "streamlit"
                  assert str(exc) == (
                      "Streamlit is required for Role-Aware Dashboard Toolkit dashboard rendering. "
                      'Install with: pip install "role-aware-dashboard-toolkit[workbench]"'
                  )
              else:
                  raise AssertionError("core wheel render should require the workbench extra")
              print(radt.__version__)
          PY
      - name: Wheel optional-extra smokes
        run: |
          wheel="$(python - <<'PY'
          import pathlib

          wheels = sorted(pathlib.Path("dist").glob("role_aware_dashboard_toolkit-*.whl"))
          assert len(wheels) == 1, wheels
          print(wheels[0])
          PY
          )"
          python -m venv .wheel-workbench-smoke
          .wheel-workbench-smoke/bin/python -m pip install "${wheel}[workbench]"
          (
            cd "$(mktemp -d)"
            "$GITHUB_WORKSPACE/.wheel-workbench-smoke/bin/python" - <<'PY'
          import pathlib

          import role_aware_dashboard_toolkit
          import streamlit

          assert ".wheel-workbench-smoke" in str(pathlib.Path(role_aware_dashboard_toolkit.__file__).resolve())
          assert streamlit.__name__ == "streamlit"
          PY
          )
          python -m venv .wheel-api-smoke
          .wheel-api-smoke/bin/python -m pip install "${wheel}[api]"
          (
            cd "$(mktemp -d)"
            "$GITHUB_WORKSPACE/.wheel-api-smoke/bin/python" - <<'PY'
          import pathlib

          import role_aware_dashboard_toolkit
          import fastapi
          import pydantic
          import uvicorn
          from role_aware_dashboard_toolkit.api import FASTAPI_AVAILABLE

          assert ".wheel-api-smoke" in str(pathlib.Path(role_aware_dashboard_toolkit.__file__).resolve())
          assert FASTAPI_AVAILABLE is True
          assert fastapi.__name__ == "fastapi"
          assert pydantic.__name__ == "pydantic"
          assert uvicorn.__name__ == "uvicorn"
          PY
          )
          python -m venv .wheel-pandas-smoke
          .wheel-pandas-smoke/bin/python -m pip install "${wheel}[pandas]"
          (
            cd "$(mktemp -d)"
            "$GITHUB_WORKSPACE/.wheel-pandas-smoke/bin/python" - <<'PY'
          import pathlib

          import role_aware_dashboard_toolkit
          import pandas

          assert ".wheel-pandas-smoke" in str(pathlib.Path(role_aware_dashboard_toolkit.__file__).resolve())
          assert pandas.__name__ == "pandas"
          PY
          )
          python -m venv .wheel-full-smoke
          .wheel-full-smoke/bin/python -m pip install "${wheel}[full]"
          (
            cd "$(mktemp -d)"
            "$GITHUB_WORKSPACE/.wheel-full-smoke/bin/python" - <<'PY'
          import pathlib

          import role_aware_dashboard_toolkit
          import fastapi
          import pandas
          import pydantic
          import streamlit
          import uvicorn

          assert ".wheel-full-smoke" in str(pathlib.Path(role_aware_dashboard_toolkit.__file__).resolve())
          assert all(
              module.__name__
              for module in (fastapi, pandas, pydantic, streamlit, uvicorn)
          )
          PY
          )
      - name: Sdist install smoke
        run: |
          python -m venv .sdist-smoke
          .sdist-smoke/bin/python -m pip install hatchling
          sdist="$(python - <<'PY'
          import pathlib

          sdists = sorted(pathlib.Path("dist").glob("role_aware_dashboard_toolkit-*.tar.gz"))
          assert len(sdists) == 1, sdists
          print(sdists[0])
          PY
          )"
          .sdist-smoke/bin/python -m pip install --no-index --find-links dist --no-build-isolation "$sdist"
          .sdist-smoke/bin/python - <<'PY'
          import importlib.util
          import os
          import pathlib
          import sys
          import tempfile

          repo = pathlib.Path.cwd().resolve()
          def _resolved(value: str) -> pathlib.Path:
              return pathlib.Path(value or ".").resolve()
          def _is_repo_path(path: pathlib.Path) -> bool:
              return path == repo or repo in path.parents

          sys.path[:] = [
              value
              for value in sys.path
              if not _is_repo_path(_resolved(value))
          ]
          assert all(not _is_repo_path(_resolved(value)) for value in sys.path)

          with tempfile.TemporaryDirectory() as tmpdir:
              os.chdir(tmpdir)
              import role_aware_dashboard_toolkit as radt
              from role_aware_dashboard_toolkit import dashboard as dashboard_module

              assert ".sdist-smoke" in str(pathlib.Path(radt.__file__).resolve())
              assert importlib.util.find_spec("streamlit") is None
              assert "streamlit" not in sys.modules
              assert radt.DashboardConfig is dashboard_module.DashboardConfig
              assert radt.render is dashboard_module.render
              config = radt.DashboardConfig(icon="Core", layout="columns", run_store=None)
              assert config.icon == "Core"
              assert config.layout == "columns"
              run = radt.build_run({"refresh_seconds": 10}, actor="ci")
              packet = radt.build_run_packet(run)
              assert packet["packet_type"] == "run"
              assert packet["payload"]["run_id"] == run["run_id"]
              try:
                  radt.render(config)
              except ModuleNotFoundError as exc:
                  assert exc.name == "streamlit"
                  assert 'pip install "role-aware-dashboard-toolkit[workbench]"' in str(exc)
              else:
                  raise AssertionError("core sdist render should require the workbench extra")
              print(radt.__version__)
          PY
      - name: Upload validated distribution artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: role_aware_dashboard_toolkit-validated-dist
          path: dist/*
          if-no-files-found: error
  release-candidate:
    # Disabled until the owner explicitly authorizes hosted CI spending.
    if: ${{ false }}
    needs: [test, coverage-gate, packaging-release-smoke, windows-release-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Download validated distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: role_aware_dashboard_toolkit-validated-dist
          path: dist
          digest-mismatch: error
      - name: Release-candidate publication hygiene
        run: |
          python tools/pre_release_check.py --json --require-clean > pre_release_report.json || true
          python - <<'PY'
          import json
          import pathlib

          report = json.loads(pathlib.Path("pre_release_report.json").read_text(encoding="utf-8"))
          # Pre-OSS release state remains intentionally blocked only on these gates.
          allowed_blocked = {"distribution_name_ownership", "oss_public_coordinates", "security_intake_contact"}
          blocked = sorted(report.get("blocked", []))
          unexpected_blocked = sorted(item for item in blocked if item not in allowed_blocked)
          failures = list(report.get("failures", []))
          if failures:
              raise SystemExit(f"pre_release_check failures present: {failures}")
          if unexpected_blocked:
              raise SystemExit(f"pre_release_check unexpected blocked checks: {unexpected_blocked}")
          PY
      - name: Twine check
        run: python -m twine check dist/*
      - name: Artifact hygiene audit
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          from role_aware_dashboard_toolkit.release_audit import audit_release_artifact_members

          members = []
          for artifact in pathlib.Path("dist").iterdir():
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      members.extend(archive.namelist())
              elif artifact.name.endswith(".tar.gz"):
                  with tarfile.open(artifact, "r:gz") as archive:
                      members.extend(archive.getnames())

          assert members
          audit = audit_release_artifact_members(members)
          assert audit["ok"], audit
          PY
      - name: Build release-candidate evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          import role_aware_dashboard_toolkit as radt
          from role_aware_dashboard_toolkit.release_audit import build_release_manifest

          source_sha = os.environ.get("GITHUB_SHA", "").strip()
          if not source_sha:
              raise SystemExit("GITHUB_SHA is required for release-candidate evidence")
          workspace = pathlib.Path(os.environ.get("GITHUB_WORKSPACE") or ".").resolve()
          checked_out_sha = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              cwd=workspace,
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if source_sha != checked_out_sha:
              raise SystemExit(f"GITHUB_SHA {source_sha} does not match checked-out commit {checked_out_sha}")
          artifacts = sorted(path for path in pathlib.Path("dist").iterdir() if path.is_file())
          if len([path for path in artifacts if path.suffix == ".whl"]) != 1:
              raise SystemExit("release candidate requires exactly one wheel")
          if len([path for path in artifacts if path.name.endswith(".tar.gz")]) != 1:
              raise SystemExit("release candidate requires exactly one sdist")
          artifact_sha256 = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in artifacts}
          pre_release = json.loads(pathlib.Path("pre_release_report.json").read_text(encoding="utf-8"))
          evidence = {
              "version": radt.__version__,
              "source_sha": source_sha,
              "artifact_sha256": artifact_sha256,
              "pre_release_status": pre_release.get("status"),
              "blocked": pre_release.get("blocked", []),
              "failure_count": int(pre_release.get("failure_count", len(pre_release.get("failures", [])))),
              "release_manifest": build_release_manifest(),
          }
          pathlib.Path("release_candidate_evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload release-candidate dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: role_aware_dashboard_toolkit-release-candidate-dist
          path: dist/*
          if-no-files-found: error
      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: role_aware_dashboard_toolkit-release-candidate-evidence
          path: |
            pre_release_report.json
            release_candidate_evidence.json
          if-no-files-found: error
  windows-release-smoke:
    # Disabled until the owner explicitly authorizes hosted CI spending.
    if: ${{ false }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Windows focused tests
        shell: powershell
        run: python -m pytest tests/test_path_redaction.py tests/test_permission_boundaries.py -q -p no:cacheprovider -o addopts=
      - name: Build
        run: python -m build
      - name: Wheel install smoke (Windows)
        shell: powershell
        run: |
          python -m venv .wheel-smoke-win
          .\.wheel-smoke-win\Scripts\python -m pip install --no-index --find-links dist role_aware_dashboard_toolkit
          .\.wheel-smoke-win\Scripts\python -c "import os, pathlib, sys, tempfile; repo=pathlib.Path.cwd().resolve(); _resolved=lambda value: pathlib.Path(value or '.').resolve(); _is_repo_path=lambda path: path==repo or repo in path.parents; sys.path=[value for value in sys.path if not _is_repo_path(_resolved(value))]; assert all(not _is_repo_path(_resolved(value)) for value in sys.path); tmpdir=tempfile.mkdtemp(); os.chdir(tmpdir); import role_aware_dashboard_toolkit as radt; config=radt.DashboardConfig(icon='Core', layout='columns', run_store=None); assert config.icon=='Core'; assert config.layout=='columns'; run=radt.build_run({'refresh_seconds': 10}, actor='ci'); packet=radt.build_run_packet(run); assert packet['packet_type']=='run'; assert packet['payload']['run_id']==run['run_id']; print(radt.__version__)"
          if (Test-Path -LiteralPath ".wheel-smoke-win") { Remove-Item -LiteralPath ".wheel-smoke-win" -Recurse -Force }
